<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Bot Panel</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--accent:#3b82f6;--border:#334155;--red:#ef4444}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh}
  .box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:30px;width:100%;max-width:380px}
  h1{font-size:22px;margin-bottom:6px;text-align:center}
  p.sub{color:var(--muted);text-align:center;margin-bottom:20px;font-size:14px}
  label{display:block;margin:14px 0 6px;font-size:14px;color:var(--muted)}
  input{width:100%;padding:11px;border-radius:8px;border:1px solid var(--border);background:#273449;color:var(--text);font-size:14px}
  input:focus{outline:none;border-color:var(--accent)}
  .btn{width:100%;margin-top:18px;padding:11px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  .btn:hover{filter:brightness(1.1)}
  .err{padding:10px;border-radius:8px;margin-bottom:14px;background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.3);text-align:center}
</style><script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
<form class="box" method="post">
  <h1>🛡️ Bot Panel</h1>
  <p class="sub">Admin login</p>
  {% if error %}<div class="err">{{error}}</div>{% endif %}
  <label>Admin Password</label>
  <input type="password" name="password" placeholder="পাসওয়ার্ড দিন" autofocus required>
  <button class="btn" type="submit">Login</button>
</form>
</body></html>
